# Astra Data Collector - Default Parameters
#
# FPS modes:
#   0 = idle (no upload)
#   1 = 1 fps  (slow, for debugging / low bandwidth)
#   2 = 10 fps (medium)
#   3 = 20 fps (fast, high bandwidth ~2-10 MB/s)
#
# Change at runtime:  rosparam set /frame_sender/fps_mode 2

